<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- PIMLR: Unity 6 template (createUnityInstance). Frostweep Microphone Pro adds its microphone.js tag just before the head closes, at post-build. -->
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:sans-serif; color:#fff; }
    #unity-container { position:fixed; inset:0; width:100%; height:100%; background:#000; }
    #unity-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; background:#000; outline:none; }
    .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; z-index:2; }
    .gone { display:none !important; }
    #bar { width:min(420px,70vw); height:10px; background:#333; border-radius:5px; overflow:hidden; margin-top:16px; }
    #fill { width:0%; height:100%; background:#fff; transition:width .2s; }
    #pct { margin-top:8px; font-size:14px; opacity:.7; }
    #start { cursor:pointer; background:rgba(0,0,0,.85); font-size:28px; letter-spacing:.05em; }
    #fs { position:fixed; right:12px; bottom:12px; z-index:3; padding:8px 12px; }
    #err { position:fixed; left:0; right:0; top:0; z-index:4; padding:10px 14px; background:#a00; font-size:14px; }
  </style>
</head>
<body>
  <!-- PIMLR: Vuplex 2D WebView fullscreens the element with id "unity-container" (and WebGLInput reads the canvas parent id) -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading" class="overlay">
    <div>Loading {{{ PRODUCT_NAME }}}...</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
  </div>
  <div id="start" class="overlay gone">Click to start</div>
  <button id="fs" class="gone">Fullscreen</button>
  <div id="err" class="gone"></div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        var e = document.getElementById("err"); e.textContent = msg; e.classList.remove("gone");
      }
    };

    var loader = document.createElement("script");
    loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    loader.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
        document.getElementById("pct").textContent = Math.round(100 * p) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        document.getElementById("loading").classList.add("gone");
        var start = document.getElementById("start");
        start.classList.remove("gone");
        start.addEventListener("click", function () {
          // PIMLR: the click gives the page focus, so gamepad + keyboard input register immediately
          start.classList.add("gone");
          window.focus(); canvas.focus();
          document.getElementById("fs").classList.remove("gone");
        });
        // Vuplex WebView's post-build step rewrites this call to window.vuplex.SetFullscreen(1)
        document.getElementById("fs").onclick = function () { unityInstance.SetFullscreen(1); };
      }).catch(function (message) { config.showBanner(String(message), "error"); });
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
